<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ch7-presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Product Management</h1>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <div class="form-row">
          <label for="product-name">Name</label>
          <input type="text" id="product-name" required />
        </div>
        <div class="form-row">
          <label for="product-price">Price</label>
          <input type="number" id="product-price" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="cancel-edit" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
      <div class="paging-controls" style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1rem">
        <label for="page-size">Page size:</label>
        <select id="page-size" style="padding: 0.3em 1em; border-radius: 6px">
          <option value="5" selected>5</option>
          <option value="10">10</option>
          <option value="20">20</option>
        </select>
        <div id="pagination" style="margin-left: auto; display: flex; gap: 0.5rem"></div>
      </div>
      <table id="products-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script src="/src/products.js"></script>
  </body>
</html>
